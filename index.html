<!DOCTYPE html>
<html>
<head>
<title>Snake</title>
<style>
body{
  background:#0f0f0f;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
  font-family:monospace;
  color:white;
}
canvas{
  background:black;
  border:2px solid #444;
}
</style>
</head>

<body>

<div>
<p>Arrow keys to move</p>
<canvas id="game" width="400" height="400"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const grid = 20;

let snake = [{x:160,y:160}];
let dx = grid;
let dy = 0;

let apple = {
  x:320,
  y:320
};

function loop(){
  requestAnimationFrame(loop);

  if(++count < 6) return;
  count = 0;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  snake[0].x += dx;
  snake[0].y += dy;

  if(snake[0].x < 0) snake[0].x = canvas.width-grid;
  else if(snake[0].x >= canvas.width) snake[0].x = 0;

  if(snake[0].y < 0) snake[0].y = canvas.height-grid;
  else if(snake[0].y >= canvas.height) snake[0].y = 0;

  snake.unshift({x:snake[0].x,y:snake[0].y});

  if(snake[0].x === apple.x && snake[0].y === apple.y){
    apple.x = Math.floor(Math.random()*20)*grid;
    apple.y = Math.floor(Math.random()*20)*grid;
  } else {
    snake.pop();
  }

  ctx.fillStyle = "red";
  ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

  ctx.fillStyle = "lime";

  snake.forEach(function(cell,index){
    ctx.fillRect(cell.x, cell.y, grid-1, grid-1);

    for(let i=index+1;i<snake.length;i++){
      if(cell.x===snake[i].x && cell.y===snake[i].y){
        snake=[{x:160,y:160}];
        dx=grid;
        dy=0;
      }
    }
  });
}

let count=0;
requestAnimationFrame(loop);

document.addEventListener("keydown",function(e){
  if(e.which===37 && dx===0){
    dx=-grid; dy=0;
  }
  else if(e.which===38 && dy===0){
    dy=-grid; dx=0;
  }
  else if(e.which===39 && dx===0){
    dx=grid; dy=0;
  }
  else if(e.which===40 && dy===0){
    dy=grid; dx=0;
  }
});
</script>

</body>
</html>
