<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="scoreboard">
    <span class="score-label">SCORE</span>
    <span id="score-value">0</span>
  </div>

  <div id="canvas-wrapper">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="pause-overlay" class="hidden">
      <div class="pause-icon">
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>

  <!-- D-pad: only visible on touch devices (controlled via CSS media query) -->
  <div id="dpad" role="group" aria-label="Directional controls">
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-up"    data-dir="ArrowUp"    aria-label="Up">▲</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-left"  data-dir="ArrowLeft"  aria-label="Left">◀</button>
    <div class="dpad-center"></div>
    <button class="dpad-btn" id="btn-right" data-dir="ArrowRight" aria-label="Right">▶</button>
    <div class="dpad-empty"></div>
    <button class="dpad-btn" id="btn-down"  data-dir="ArrowDown"  aria-label="Down">▼</button>
    <div class="dpad-empty"></div>
  </div>

  <script src="game.js"></script>
</body>
</html>
